services:
  mysql:
    image: mysql:8.0
    container_name: zhyq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: zhyq123456
      MYSQL_DATABASE: zhyq_park
      TZ: Asia/Shanghai
    ports:
      - "3316:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - zhyq_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pzhyq123456"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  zhyq_mysql_data:
