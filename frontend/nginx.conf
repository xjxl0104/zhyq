server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头在各静态 location 里各写一遍:nginx 的 add_header 不会继承到自带 add_header 的 location,
    # 也不放进单独的 include 文件——服务器上的 Dockerfile 有本地改动,新增 COPY 行不会生效(2026-10-11 因此 502)。
    # /api/ 由后端 Spring Security 自己输出,不重复加。
    # 前端单页路由:找不到文件回落到 index.html
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri $uri/ /index.html;
    }

    # 入口页禁缓存:每次部署后浏览器必拿最新 chunk 清单(ETag 协商,304 成本极低)
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 模型使用构建时的 gzip 副本；URL 不含 hash，必须协商缓存以免部署后模型过期。
    location ^~ /models/ {
        types { model/gltf-binary glb; }
        gzip_static on;
        # Caddy adds Via; allow the gzip variant for requests forwarded by the gateway.
        gzip_proxied any;
        gzip_vary on;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # API 反代到后端容器(compose 服务名 backend)
    location /api/ {
        # nginx 默认 1MB, 会先于后端把上传/Excel 导入截断成 413。
        # 与 application.yml 的 max-request-size(120MB) 对齐:单个附件最多 100MB。
        client_max_body_size 120m;
        proxy_pass http://backend:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大型扫描件在低速网络下上传和落盘需要更长时间，避免代理提前中断。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "public";
    }
}
