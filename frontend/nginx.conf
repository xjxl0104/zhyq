server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端单页路由:找不到文件回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口页禁缓存:每次部署后浏览器必拿最新 chunk 清单(ETag 协商,304 成本极低)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API 反代到后端容器(compose 服务名 backend)
    location /api/ {
        # nginx 默认 1MB, 会先于后端把上传/Excel 导入截断成 413。
        # 与 application.yml 的 max-request-size(50MB) 对齐
        client_max_body_size 50m;
        proxy_pass http://backend:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
