server:
  port: 8090
  servlet:
    context-path: /api

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  application:
    name: zhyq-park
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3316/zhyq_park?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

zhyq:
  vending:
    external-url: ${VENDING_EXTERNAL_URL:https://fanmaiji.top/index?isFrom=login}
  upload:
    path: ${UPLOAD_PATH:./uploads}
    url-prefix: /uploads
  jwt:
    # 生产必须由环境变量提供,不留默认值(HS256 密钥,建议 >=32 字节随机串)
    secret: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRE_SECONDS:28800}
  encryption:
    key: ${ZHYQ_FIELD_ENCRYPTION_KEY:${APP_ENCRYPTION_KEY:}}
  cors:
    # 逗号分隔允许来源;默认仅本地开发
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.trycloudflare.com}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhyq.park.**.entity

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: ${SWAGGER_ENABLED:true}
  setting:
    language: zh_cn

logging:
  level:
    com.zhyq.park: debug
