server:
  port: 8090
  # 限速解析器自行校验可信代理链；remoteAddr 必须保留真实 socket 对端。
  forward-headers-strategy: none
  servlet:
    context-path: /api

spring:
  servlet:
    multipart:
      # 合同扫描件、图纸等单个附件允许至 100MB；批量上传预留少量表单开销。
      max-file-size: 100MB
      max-request-size: 120MB
  application:
    name: zhyq-park
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3316/zhyq_park?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

zhyq:
  auth:
    # 默认不信任代理头。反向代理部署必须显式填写实际代理 IP/CIDR，禁止 0.0.0.0/0。
    trusted-proxies: ${ZHYQ_AUTH_TRUSTED_PROXIES:}
  vending:
    external-url: ${VENDING_EXTERNAL_URL:https://fanmaiji.top/index?isFrom=login}
  upload:
    path: ${UPLOAD_PATH:./uploads}
    url-prefix: /uploads
  mp:
    # 真实微信为默认;仅本地调试显式开启 mock-login=true
    mock-login: ${WX_MP_MOCK_LOGIN:false}
    appid: ${WX_MP_APPID:}
    secret: ${WX_MP_SECRET:}
  wh:
    # 云仓端凭据显式配置;与伙伴共用小程序时填同一组 AppID/Secret,不自动回落到 mp
    mock-login: ${WX_WH_MOCK_LOGIN:false}
    appid: ${WX_WH_APPID:}
    secret: ${WX_WH_SECRET:}
  jwt:
    # 生产必须由环境变量提供,不留默认值(HS256 密钥,建议 >=32 字节随机串)
    secret: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRE_SECONDS:28800}
  encryption:
    key: ${ZHYQ_FIELD_ENCRYPTION_KEY:${APP_ENCRYPTION_KEY:}}
  cors:
    # 逗号分隔允许来源;默认仅本地开发
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.trycloudflare.com}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 登录凭据等敏感 SQL 参数不得输出到标准日志。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhyq.park.**.entity

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: ${SWAGGER_ENABLED:true}
  setting:
    language: zh_cn

logging:
  level:
    com.zhyq.park: debug
